services:
  - type: web
    name: codestart
    runtime: python
    plan: free
    buildCommand: bash deploy/render-free-build.sh
    startCommand: python -m deploy.render_start
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.render_free_settings
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
